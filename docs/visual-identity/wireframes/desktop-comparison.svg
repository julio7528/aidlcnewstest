<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe desktop de Notícias e Agenda de Eventos</title>
  <desc id="desc">Comparação estática aprovada pelo proprietário das experiências de Notícias e Agenda de Eventos do GeophNews.</desc>
  <style>
    @font-face{font-family:SourceSans3;src:url('../fonts/source-sans-3-latin.woff2') format('woff2');font-weight:400 600;font-style:normal}
    @font-face{font-family:SourceSans3;src:url('../fonts/source-sans-3-latin-ext.woff2') format('woff2');font-weight:400 600;font-style:normal;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:SourceSerif4;src:url('../fonts/source-serif-4-latin.woff2') format('woff2');font-weight:600 700;font-style:normal;font-optical-sizing:auto}
    @font-face{font-family:SourceSerif4;src:url('../fonts/source-serif-4-latin-ext.woff2') format('woff2');font-weight:600 700;font-style:normal;font-optical-sizing:auto;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:SourceSerif4;src:url('../fonts/source-serif-4-italic-latin.woff2') format('woff2');font-weight:400;font-style:italic;font-optical-sizing:auto}
    @font-face{font-family:SourceSerif4;src:url('../fonts/source-serif-4-italic-latin-ext.woff2') format('woff2');font-weight:400;font-style:italic;font-optical-sizing:auto;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
    text{font-family:SourceSans3,Arial,sans-serif;fill:#252E3B}.serif{font-family:SourceSerif4,Georgia,serif}.muted{fill:#52606D}.tiny{font-size:12px;letter-spacing:.7px}.label{font-size:14px;font-weight:600}.body{font-size:16px}.small{font-size:14px}.heading{font-size:30px;font-weight:600}.title{font-size:42px;font-weight:700}.cardtitle{font-size:23px;font-weight:600}.surface{fill:#FFFFFF;stroke:#52606D;stroke-width:1}.field{fill:#FFFFFF;stroke:#52606D;stroke-width:1}.btn{fill:#252E3B}.btntext{fill:#F3F5F6;font-size:15px;font-weight:600}.link{fill:#252E3B;text-decoration:underline}.geo{fill:#426D94}.red{fill:#A24F4F}.statusgreen{fill:#E8F3EB;stroke:#252E3B;stroke-width:1}.statusamber{fill:#FFF4D6;stroke:#252E3B;stroke-width:1}.statusred{fill:#FCE9E7;stroke:#252E3B;stroke-width:1}.statusteal{fill:#E7F2F4;stroke:#252E3B;stroke-width:1}.statusneutral{fill:#ECEFF2;stroke:#252E3B;stroke-width:1}
  </style>
  <defs>
    <clipPath id="newsImage"><rect x="102" y="694" width="250" height="212"/></clipPath>
    <clipPath id="eventImage"><rect x="842" y="694" width="250" height="212"/></clipPath>
  </defs>
  <rect width="1600" height="1260" fill="#F3F5F6"/>
  <text x="70" y="42" class="tiny muted">GEOPHNEWS · IDENTIDADE VISUAL · WIREFRAME APROVADO</text>
  <rect x="0" y="62" width="1600" height="94" fill="#FFFFFF"/>
  <line x1="0" y1="156" x2="1600" y2="156" stroke="#52606D" stroke-width="1"/>
  <image href="../generated-images/logos/GeophNews%20Light%20Theme%20Globe%20Logo.png" x="70" y="85" width="215" height="44" preserveAspectRatio="xMidYMid meet"/>
  <text x="755" y="116" class="label">NOTÍCIAS</text>
  <rect x="740" y="132" width="92" height="2" class="red"/>
  <text x="885" y="116" class="label muted">AGENDA DE EVENTOS</text>
  <text x="1370" y="116" class="small muted">PT-BR　 EN-US</text>
  <text x="1515" y="116" class="small link" text-anchor="end">Entrar</text>
  <text x="70" y="219" class="serif title">Notícias e eventos por lugar</text>
  <text x="72" y="252" class="body muted">Duas experiências de busca com a mesma hierarquia editorial e geográfica.</text>

  <!-- NEWS state -->
  <rect x="70" y="292" width="720" height="782" class="surface"/>
  <text x="102" y="332" class="tiny geo">NEWS · ESTADO DE BUSCA</text>
  <text x="102" y="376" class="serif heading">Notícias</text>
  <text x="102" y="402" class="small muted">Publicações das últimas 24 horas</text>
  <text x="102" y="448" class="label">Área geográfica</text>
  <rect x="102" y="461" width="654" height="56" class="field"/>
  <image href="../generated-images/icons/location-pin.png" x="120" y="475" width="28" height="28"/>
  <text x="160" y="495" class="body">Escolha uma área no mapa</text>
  <text x="730" y="495" class="small geo" text-anchor="end">Selecionar</text>
  <text x="102" y="554" class="label">Categoria</text>
  <text x="434" y="554" class="label">Tópico opcional</text>
  <rect x="102" y="567" width="306" height="52" class="field"/>
  <rect x="434" y="567" width="322" height="52" class="field"/>
  <text x="120" y="599" class="body">Todas as categorias　⌄</text>
  <text x="452" y="599" class="body muted">Digite um assunto</text>
  <rect x="102" y="626" width="174" height="45" class="btn"/>
  <text x="189" y="654" text-anchor="middle" class="btntext">Buscar notícias</text>
  <text x="298" y="654" class="small muted">Até 10 resultados · ordenar por relevância</text>
  <rect x="102" y="694" width="654" height="212" fill="#F3F5F6" stroke="#52606D" stroke-width="1"/>
  <image href="../generated-images/Aerial%20City%20Map%20with%20Connected%20Neighbourhoods.webp" x="102" y="694" width="250" height="212" preserveAspectRatio="xMidYMid slice" clip-path="url(#newsImage)"/>
  <text x="374" y="729" class="tiny muted">RESULTADO ILUSTRATIVO</text>
  <text x="374" y="766" class="serif cardtitle">Título de notícia em</text>
  <text x="374" y="795" class="serif cardtitle">uma ou duas linhas</text>
  <text x="374" y="829" class="small">Teaser curto para antecipar o assunto</text>
  <text x="374" y="850" class="small">e sua relação com a área selecionada.</text>
  <text x="374" y="883" class="tiny muted">FONTE ORIGINAL　·　HORÁRIO VERIFICADO</text>
  <image href="../generated-images/icons/source-link.png" x="711" y="864" width="24" height="24"/>
  <rect x="510" y="925" width="246" height="113" class="statusgreen"/>
  <circle cx="534" cy="951" r="8" fill="#252E3B"/>
  <text x="552" y="956" class="label" fill="#252E3B">Busca concluída</text>
  <text x="530" y="984" class="small">Estado com texto e símbolo;</text>
  <text x="530" y="1005" class="small">cor apenas reforça a mensagem.</text>
  <image href="../generated-images/icons/filters.png" x="102" y="944" width="28" height="28"/>
  <text x="140" y="963" class="small muted">Filtros e seleção geográfica têm rótulos.</text>

  <!-- EVENT AGENDA state -->
  <rect x="810" y="292" width="720" height="782" class="surface"/>
  <text x="842" y="332" class="tiny geo">EVENT AGENDA · ESTADO DE BUSCA</text>
  <text x="842" y="376" class="serif heading">Agenda de eventos</text>
  <text x="842" y="402" class="small muted">Intervalo de datas definido pela pessoa usuária</text>
  <text x="842" y="448" class="label">Área geográfica</text>
  <rect x="842" y="461" width="654" height="56" class="field"/>
  <image href="../generated-images/icons/location-pin.png" x="860" y="475" width="28" height="28"/>
  <text x="900" y="495" class="body">Escolha uma área no mapa</text>
  <text x="1470" y="495" class="small geo" text-anchor="end">Selecionar</text>
  <text x="842" y="554" class="label">Data inicial</text>
  <text x="1178" y="554" class="label">Data final</text>
  <rect x="842" y="567" width="306" height="52" class="field"/>
  <rect x="1178" y="567" width="318" height="52" class="field"/>
  <image href="../generated-images/icons/event-calendar.png" x="858" y="579" width="28" height="28"/>
  <image href="../generated-images/icons/event-calendar.png" x="1194" y="579" width="28" height="28"/>
  <text x="898" y="599" class="body muted">Selecionar data</text>
  <text x="1234" y="599" class="body muted">Selecionar data</text>
  <text x="842" y="649" class="label">Categoria　　</text>
  <text x="1002" y="649" class="small">Todas as categorias　⌄</text>
  <rect x="1308" y="626" width="188" height="45" class="btn"/>
  <text x="1402" y="654" text-anchor="middle" class="btntext">Buscar eventos</text>
  <rect x="842" y="694" width="654" height="212" fill="#F3F5F6" stroke="#52606D" stroke-width="1"/>
  <image href="../generated-images/Cultural%20Performance%20in%20a%20Mapped%20Park.webp" x="842" y="694" width="250" height="212" preserveAspectRatio="xMidYMid slice" clip-path="url(#eventImage)"/>
  <text x="1114" y="729" class="tiny muted">EVENTO ILUSTRATIVO</text>
  <text x="1114" y="766" class="serif cardtitle">Nome do evento</text>
  <text x="1114" y="801" class="body">Data e horário verificados</text>
  <text x="1114" y="829" class="body">Local do evento</text>
  <text x="1114" y="883" class="tiny muted">FONTE ORIGINAL</text>
  <image href="../generated-images/icons/source-link.png" x="1450" y="864" width="24" height="24"/>
  <rect x="842" y="925" width="424" height="113" class="statusamber"/>
  <path d="M866 961l9-17 9 17z" fill="#252E3B"/>
  <text x="896" y="956" class="label" fill="#252E3B">Datas precisam ser informadas</text>
  <text x="862" y="984" class="small">Exemplo de atenção com texto e símbolo;</text>
  <text x="862" y="1005" class="small">nenhum intervalo vem preenchido por padrão.</text>
  <image href="../generated-images/icons/time-range.png" x="1284" y="951" width="28" height="28"/>
  <text x="1322" y="970" class="small muted">Sem data padrão</text>

  <!-- Semantic tokens specimen -->
  <text x="70" y="1132" class="tiny muted">CORES SEMÂNTICAS APROVADAS · APRESENTAÇÃO SUAVE</text>
  <rect x="70" y="1150" width="278" height="60" class="statusgreen"/><circle cx="94" cy="1180" r="7" fill="#252E3B"/><text x="112" y="1186" class="label" fill="#252E3B">Sucesso　 #276749</text>
  <rect x="366" y="1150" width="278" height="60" class="statusamber"/><path d="M389 1187l8-15 8 15z" fill="#252E3B"/><text x="416" y="1186" class="label" fill="#252E3B">Atenção　 #805500</text>
  <rect x="662" y="1150" width="278" height="60" class="statusred"/><circle cx="686" cy="1180" r="7" fill="#252E3B"/><text x="704" y="1186" class="label" fill="#252E3B">Erro　 #A32925</text>
  <rect x="958" y="1150" width="278" height="60" class="statusteal"/><circle cx="982" cy="1180" r="7" fill="#252E3B"/><text x="1000" y="1186" class="label" fill="#252E3B">Informação　 #1D6170</text>
  <rect x="1254" y="1150" width="276" height="60" class="statusneutral"/><circle cx="1278" cy="1180" r="7" fill="#252E3B"/><text x="1296" y="1186" class="label" fill="#252E3B">Neutro　 #4F5D6B</text>
</svg>
