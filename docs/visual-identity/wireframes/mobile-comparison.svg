  <text x="60" y="493" class="label">Categoria</text>
  <rect x="60" y="504" width="360" height="44" class="field"/>
  <text x="76" y="532" class="small">Todas as categorias　⌄</text>
  <text x="60" y="575" class="label">Tópico opcional</text>
  <rect x="60" y="586" width="360" height="44" class="field"/>
  <text x="76" y="614" class="small muted">Digite um assunto</text>
  <rect x="60" y="644" width="360" height="44" class="btn"/>
  <text x="240" y="672" text-anchor="middle" class="btntext">Buscar notícias</text>
  <text x="60" y="725" class="tiny muted">RESULTADO · PLACEHOLDER</text>
  <rect x="60" y="739" width="360" height="250" fill="#F3F5F6" stroke="#52606D" stroke-width="1"/>
  <image href="../generated-images/Aerial%20City%20Map%20with%20Connected%20Neighbourhoods.webp" x="60" y="739" width="360" height="160" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneNews)"/>
  <text x="76" y="929" class="serif cardtitle">Título de notícia em</text>
  <text x="76" y="953" class="serif cardtitle">até duas linhas</text>
  <text x="76" y="980" class="small muted">Teaser e fonte original verificada</text>

  <!-- Event phone -->
  <rect x="480" y="142" width="400" height="900" class="surface"/>
  <rect x="480" y="142" width="400" height="70" fill="#FFFFFF" stroke="#52606D" stroke-width="1"/>
  <image href="../generated-images/logos/Minimalist%20GN%20Logo%20Dark.png" x="500" y="160" width="47" height="34" preserveAspectRatio="xMidYMid meet"/>
  <text x="770" y="183" class="small muted">PT-BR　☰</text>
  <text x="500" y="250" class="tiny geo">EVENT AGENDA</text>
  <text x="500" y="289" class="serif title">Agenda de eventos</text>
  <text x="500" y="316" class="small muted">Escolha um intervalo de datas</text>
  <rect x="500" y="338" width="360" height="42" class="field"/>
  <rect x="680" y="378" width="180" height="2" class="red"/>
  <text x="516" y="365" class="small muted">Notícias</text>
  <text x="666" y="365" class="small">Agenda de eventos</text>
  <text x="500" y="408" class="label">Área geográfica</text>
  <rect x="500" y="420" width="360" height="46" class="field"/>
  <image href="../generated-images/icons/location-pin.png" x="514" y="429" width="28" height="28"/>
  <text x="552" y="449" class="small">Escolha uma área</text>
  <text x="500" y="493" class="label">Período</text>
  <rect x="500" y="504" width="174" height="44" class="field"/>
  <rect x="686" y="504" width="174" height="44" class="field"/>
  <image href="../generated-images/icons/event-calendar.png" x="511" y="512" width="26" height="26"/>
  <image href="../generated-images/icons/event-calendar.png" x="697" y="512" width="26" height="26"/>
  <text x="544" y="532" class="tiny muted">Data inicial</text>
  <text x="730" y="532" class="tiny muted">Data final</text>
  <text x="500" y="575" class="label">Categoria</text>
  <rect x="500" y="586" width="360" height="44" class="field"/>
  <text x="516" y="614" class="small">Todas as categorias　⌄</text>
  <rect x="500" y="644" width="360" height="44" class="btn"/>
  <text x="680" y="672" text-anchor="middle" class="btntext">Buscar eventos</text>
  <text x="500" y="725" class="tiny muted">RESULTADO · PLACEHOLDER</text>
  <rect x="500" y="739" width="360" height="250" fill="#F3F5F6" stroke="#52606D" stroke-width="1"/>
  <image href="../generated-images/Cultural%20Performance%20in%20a%20Mapped%20Park.webp" x="500" y="739" width="360" height="150" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneEvent)"/>
  <text x="516" y="920" class="serif cardtitle">Nome do evento</text>
  <text x="516" y="948" class="small">Data, horário e local verificados</text>
  <text x="516" y="980" class="small link">Fonte original</text>
  <rect x="500" y="1000" width="360" height="32" class="statusamber"/>
  <text x="514" y="1021" class="tiny" fill="#252E3B">Atenção: informe as duas datas</text>
