  <defs>
    <clipPath id="phoneNews"><rect x="60" y="739" width="360" height="160"/></clipPath>
    <clipPath id="phoneEvent"><rect x="500" y="739" width="360" height="150"/></clipPath>
  </defs>
  <rect width="920" height="1120" fill="#F3F5F6"/>
  <text x="40" y="40" class="tiny muted">GEOPHNEWS · MOBILE · WIREFRAME APROVADO</text>
  <text x="40" y="82" class="serif title">Duas experiências, uma identidade</text>
  <text x="42" y="110" class="small muted">Estrutura de busca empilhada para leitura e controles em celular.</text>

  <!-- News phone -->
  <rect x="40" y="142" width="400" height="900" class="surface"/>
  <rect x="40" y="142" width="400" height="70" fill="#FFFFFF" stroke="#52606D" stroke-width="1"/>
