  <rect x="60" y="338" width="360" height="42" class="field"/>
  <rect x="60" y="378" width="180" height="2" class="red"/>
  <text x="76" y="365" class="small">Notícias</text>
  <text x="225" y="365" class="small muted">Agenda de eventos</text>
